<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixture HTML</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        h2 {
            margin: 0;
            color: #333;
        }
        button {
            padding: 14px 20px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background-color: #6750A4;
            color: white;
            cursor: pointer;
        }
        button:active {
            background-color: #4f378b;
        }
        input {
            padding: 12px 16px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <h2>Web View Content</h2>
    <button id="web_accept" onclick="if (window.FixtureBridge) { window.FixtureBridge.event('tap', 'web_accept'); }">Accept</button>
    <button id="web_next" onclick="if (window.FixtureBridge) { window.FixtureBridge.event('tap', 'web_next'); }">Next</button>
    <input id="web_email" type="email" placeholder="Email" onchange="if (window.FixtureBridge) { window.FixtureBridge.event('text', 'web_email', this.value); }" />
</body>
</html>
