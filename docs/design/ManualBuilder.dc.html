<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Schibsted Grotesk', system-ui, sans-serif; }
    a { color: #1A73E8; } a:hover { color: #1557b0; }
    .slot { cursor: pointer; }
  </style>
</helmet>
<div style="width: 400px; height: 860px; background: {{tint}}; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 8px 16px;">
    <div style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
    </div>
    <div onClick="{{cycleName}}" class="slot" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 20px; background: rgba(255,255,255,0.22);">
      <div style="font-size: 14px; font-weight: 600; color: #FFFFFF;">{{shortcutName}}</div>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
    </div>
    <div style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{tint}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
    </div>
  </div>

  <div style="display: flex; justify-content: center; padding: 14px 0 6px 0;">
    <div style="width: 108px; height: 108px; border-radius: 30px; background: rgba(255,255,255,0.18); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;">
      <div style="width: 52px; height: 52px; border-radius: 17px; background: #FFFFFF; display: flex; align-items: center; justify-content: center;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{tint}}" stroke-width="2" stroke-linecap="round"><path d="M13 2 3 14h9l-1 8 10-12h-9z"></path></svg>
      </div>
      <div style="font-size: 12.5px; font-weight: 600; color: #FFFFFF;">{{stepCount}}</div>
    </div>
  </div>

  <div style="flex-grow: 1; padding: 10px 24px 0 24px; display: flex; flex-direction: column; gap: 18px; overflow: hidden;">

    <div style="display: flex; gap: 12px; align-items: flex-start;">
      <div style="width: 22px; font-size: 15px; font-weight: 700; color: rgba(255,255,255,0.6); padding-top: 4px;">1</div>
      <div style="flex-grow: 1; font-size: 21px; font-weight: 600; color: #FFFFFF; line-height: 1.5; letter-spacing: -0.2px;">
        <span>Turn </span><span onClick="{{cycleState}}" class="slot" style="border-bottom: 2.5px dotted rgba(255,255,255,0.75); padding-bottom: 2px;">{{stateSlot}}</span><span> the </span><span onClick="{{cycleControl}}" class="slot" style="border-bottom: 2.5px dotted rgba(255,255,255,0.75); padding-bottom: 2px;">{{controlSlot}}</span>
      </div>
      <div style="width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; padding-top: 4px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
      </div>
    </div>

    <div style="display: flex; gap: 12px; align-items: flex-start;">
      <div style="width: 22px; font-size: 15px; font-weight: 700; color: rgba(255,255,255,0.6); padding-top: 4px;">2</div>
      <div style="flex-grow: 1; font-size: 21px; font-weight: 600; color: #FFFFFF; line-height: 1.5; letter-spacing: -0.2px;">
        <span>Open </span><span onClick="{{cycleApp}}" class="slot" style="border-bottom: 2.5px dotted rgba(255,255,255,0.75); padding-bottom: 2px;">{{appSlot}}</span>
      </div>
      <div style="width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; padding-top: 4px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.65)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
      </div>
    </div>

    <div style="display: flex; gap: 12px; align-items: center; opacity: 0.75;">
      <div style="width: 22px;"></div>
      <div onClick="{{addStep}}" class="slot" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 22px; border: 1.5px dashed rgba(255,255,255,0.55);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        <div style="font-size: 14px; font-weight: 600; color: #FFFFFF;">Add a step</div>
      </div>
    </div>

  </div>

  <div style="display: flex; gap: 8px; padding: 0 20px 10px 20px;">
    <sc-for list="{{swatches}}" as="sw" hint-placeholder-count="6">
      <div style="width: 38px; height: 38px; border-radius: 19px; background: {{sw.color}}; border: {{sw.ring}};"></div>
    </sc-for>
  </div>

  <div style="display: flex; gap: 10px; padding: 6px 20px 24px 20px;">
    <div style="flex-grow: 1; height: 52px; border-radius: 26px; border: 1.5px solid rgba(255,255,255,0.6); display: flex; align-items: center; justify-content: center; gap: 8px;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 9-14 9z"></path></svg>
      <div style="font-size: 15px; font-weight: 600; color: #FFFFFF;">Test run</div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"tint":{"editor":"color","default":"#00897B","options":["#9C27B0","#1A73E8","#34A853","#F57C00","#D32F2F","#00897B"]}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { state: 0, control: 0, app: 0, name: 0 };
  }
  renderVals() {
    const tint = this.props.tint ?? '#00897B';
    const states = ['on', 'off'];
    const controls = ['flashlight', 'Do Not Disturb', 'Wi-Fi', 'Bluetooth'];
    const apps = ['Camera', 'Spotify', 'Maps', 'Chrome'];
    const names = ['Night walk', 'Torch run', 'Evening'];
    const palette = ['#9C27B0', '#1A73E8', '#34A853', '#F57C00', '#D32F2F', '#00897B'];
    return {
      tint: tint,
      shortcutName: names[this.state.name % names.length],
      stepCount: '2 steps',
      stateSlot: states[this.state.state % states.length],
      controlSlot: controls[this.state.control % controls.length],
      appSlot: apps[this.state.app % apps.length],
      swatches: palette.map((c) => ({
        color: c,
        ring: c === tint ? '3px solid #FFFFFF' : '3px solid rgba(255,255,255,0)'
      })),
      cycleState: () => this.setState({ state: this.state.state + 1 }),
      cycleControl: () => this.setState({ control: this.state.control + 1 }),
      cycleApp: () => this.setState({ app: this.state.app + 1 }),
      cycleName: () => this.setState({ name: this.state.name + 1 }),
      addStep: () => this.setState({ app: this.state.app + 1 })
    };
  }
}
</script>
</body>
</html>
